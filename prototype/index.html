  <script>
  'use strict';
  // All catalogue and guide content is fictional. No source URL is fetched.
  const icon = (name, extra='') => `<svg class="icon ${extra}" aria-hidden="true"><use href="#i-${name}"/></svg>`;
  const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const channels = [
    {id:'lumen',name:'Lumen One',mark:'L',category:'Culture',title:'The shape of tomorrow',next:'Form & function',desc:'Meet the people and ideas quietly shaping a more thoughtful world.',scene:'dunes',color:'#dce8d7',bg:'#364a40'},
    {id:'atlas',name:'Open Atlas',mark:'A',category:'Nature',title:'Beyond the blue',next:'Coastlines',desc:'Follow the tide to the places where the land ends and the stories begin.',scene:'ocean',color:'#b8e5e5',bg:'#233e4b'},
    {id:'northlight',name:'Northlight',mark:'n',category:'Nature',title:'Quiet horizons',next:'A slower season',desc:'A quiet journey through wild valleys, distant ridgelines, and wide-open spaces.',scene:'alpine',color:'#c7d5bf',bg:'#35463d'},
    {id:'form',name:'Form & Frame',mark:'f.',category:'Culture',title:'Objects & their stories',next:'The makers',desc:'Everyday objects, extraordinary stories. A closer look at the things we live with.',scene:'architecture',color:'#e2c5a4',bg:'#45382f'},
    {id:'current',name:'Current',mark:'C',category:'News',title:'A world in focus',next:'The daily picture',desc:'An imagined news channel for exploring the RAPOPLAYER interface.',scene:'city',color:'#d8dfea',bg:'#303b50'},
    {id:'pulse',name:'Frequency',mark:'frq',category:'Music',title:'Late-night frequencies',next:'The listening room',desc:'Space to listen. A fictional programme of sound, mood, and after-dark discoveries.',scene:'night',color:'#dbc3e3',bg:'#43364b'},
    {id:'arc',name:'Arc Sport',mark:'arc',category:'Sport',title:'Motion studies',next:'The warm-up',desc:'The rhythm of movement and the people who find their own way forward.',scene:'dunes',color:'#e7d69a',bg:'#4b442d'},
    {id:'studio',name:'Studio 08',mark:'08',category:'Culture',title:'Inside the frame',next:'Creative lives',desc:'Step inside the spaces where interesting ideas become something real.',scene:'architecture',color:'#e4c9bc',bg:'#473931'},
    {id:'terra',name:'Terra',mark:'t',category:'Nature',title:'The wild in between',next:'Into the green',desc:'Small discoveries from the natural world, far from the usual paths.',scene:'alpine',color:'#c2d9ba',bg:'#304337'},
    {id:'mono',name:'Mono Radio',mark:'m',category:'Music',title:'Sunday selections',next:'In the groove',desc:'A little room for good music and the stories behind it. Sample programme only.',scene:'night',color:'#cbc9e0',bg:'#37364b'},
    {id:'orbit',name:'Orbit',mark:'O',category:'Culture',title:'A different perspective',next:'People & places',desc:'Fresh ways of seeing familiar places. An original fictional channel.',scene:'city',color:'#e4c5ad',bg:'#493b33'},
    {id:'coast',name:'Coast',mark:'c',category:'Nature',title:'Where the water goes',next:'Island time',desc:'Breathe out and follow the coastline, one unhurried scene at a time.',scene:'ocean',color:'#b8ddd7',bg:'#254440'},
    {id:'horizon',name:'Horizon News',mark:'H',category:'News',title:'The evening edition',next:'A wider view',desc:'Fictional headlines and sample guide information for this interactive prototype.',scene:'city',color:'#bfd4e0',bg:'#293f4d'},
    {id:'tempo',name:'Tempo',mark:'tm',category:'Music',title:'Sessions in color',next:'Acoustic hour',desc:'A fictional front-row seat to the quieter side of live music.',scene:'architecture',color:'#e6cbb2',bg:'#4c3b30'},
    {id:'motion',name:'Motion',mark:'M',category:'Sport',title:'Find your pace',next:'On the trail',desc:'Original sample guide content inspired by the simple pleasure of moving.',scene:'alpine',color:'#c6dece',bg:'#30483b'},
    {id:'signal',name:'Signal',mark:'S',category:'News',title:'The big picture',next:'Across the map',desc:'A sample channel for browsing categories, guide information, and favorites.',scene:'city',color:'#d7dce6',bg:'#333f51'},
    {id:'afterhours',name:'After Hours',mark:'ah',category:'Music',title:'The city slows down',next:'Midnight textures',desc:'An atmospheric, fictional playlist for the space between day and night.',scene:'night',color:'#d9c6e1',bg:'#43374c'},
    {id:'summit',name:'Summit Sport',mark:'S+',category:'Sport',title:'Above the everyday',next:'A new route',desc:'Discover an imagined programme about finding a little adventure outdoors.',scene:'alpine',color:'#d5ddbf',bg:'#3c462e'}
  ];
  const storageKey = 'rapoplayer.prototype.v1';
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem(storageKey) || '{}') || {}; } catch (_) {}
  const validIds = values => Array.isArray(values) ? values.filter(x => channels.some(c => c.id === x)).slice(0,50) : [];
  const state = {view:'Live',category:'All channels',query:'',selected:'lumen',favorites:new Set(Array.isArray(saved.favorites)?validIds(saved.favorites):['lumen','atlas']),recent:validIds(saved.recent),sourceName:'Studio playlist',audio:saved.audio==='French'?'French':'English',subtitle:['Off','English','French'].includes(saved.subtitle)?saved.subtitle:'Off',fill:!!saved.fill,parental:false,locks:new Set(),player:null,paused:false,controls:true,guideCleared:false};
  let modalKind=null,modalData=null,returnFocus=null,importTimer=null,importEpoch=0,toastTimer=null,hideTimer=null,sceneSerial=0;
  const main=document.getElementById('main'), modal=document.getElementById('modal'), player=document.getElementById('player');
  function persist(){try{localStorage.setItem(storageKey,JSON.stringify({favorites:[...state.favorites],recent:state.recent,audio:state.audio,subtitle:state.subtitle,fill:state.fill}));}catch(_){}}
  function toast(message){const node=document.getElementById('toast');node.textContent=message;node.classList.add('visible');clearTimeout(toastTimer);toastTimer=setTimeout(()=>node.classList.remove('visible'),3300);}
  function isLocked(c){return state.parental&&state.locks.has(c.id);}
  function getChannel(id=state.selected){return channels.find(c=>c.id===id)||channels[0];}
  function logo(c){return `<span class="channel-logo ${c.mark.length>1?'sans':''}" style="--logo-color:${c.color};--logo-bg:${c.bg}">${isLocked(c)?icon('lock'):esc(c.mark)}</span>`;}
  function scene(kind){
    const id='scene-'+(++sceneSerial);
    const palettes={dunes:['#344d50','#b8b99d','#b9a188','#847c66','#455c55'],ocean:['#213c4a','#b0c8c2','#688f91','#366474','#1b404e'],alpine:['#2d434c','#c2c9b1','#8b9f93','#466c67','#263f40'],city:['#394858','#b4aa9a','#858a8b','#5a6872','#2b3b48'],night:['#252e48','#8e819a','#5b607c','#3b405f','#202b43'],architecture:['#50564e','#d0bfa1','#ad9478','#7d806b','#414e49']};
    const p=palettes[kind]||palettes.dunes;
    let forms='';
    if(kind==='architecture') forms=`<rect x="380" y="70" width="220" height="400" rx="110" fill="${p[2]}"/><path d="M430 470V235a60 60 0 0 1 120 0v235" fill="${p[4]}"/><rect x="630" y="145" width="135" height="325" fill="${p[3]}"/><path d="M0 400 800 335v165H0z" fill="${p[4]}"/><path d="M540 470 800 360v140H0z" fill="${p[3]}" opacity=".7"/>`;
    else if(kind==='city') forms=`<path d="M0 380h300V260h48v120h31V190h55v190h30V228h70v152h30V120h47v260h30V235h75v145h35V285h49v215H0z" fill="${p[3]}"/><path d="M0 440h360V330h90v110h60V290h70v150h80V350h70v90h70v60H0z" fill="${p[4]}"/><path d="M592 145v210m-14-180h30m-30 24h30m-30 24h30m-30 24h30m-30 24h30" stroke="${p[1]}" opacity=".3" stroke-width="3"/>`;
    else if(kind==='ocean') forms=`<path d="M0 240q170-45 360 0t440-10v270H0z" fill="${p[2]}"/><path d="M0 285q200-25 400 0t400-10v225H0z" fill="${p[3]}"/><path d="m0 360 170-90 75 40 82-8 105 78 200 120H0z" fill="${p[4]}"/><path d="M340 330q190 5 410-23M430 380q150 5 310-14M525 430q100 0 210-10" stroke="${p[1]}" stroke-width="2" opacity=".23" fill="none"/>`;
    else if(kind==='alpine') forms=`<path d="m0 360 200-140 110 65L470 100l200 215L800 210v290H0z" fill="${p[2]}"/><path d="m420 158 50-58 66 72-57-29-18 15-10-19z" fill="${p[1]}" opacity=".65"/><path d="m0 395 230-135 220 135L660 235l140 120v145H0z" fill="${p[3]}"/><path d="m0 485 260-85 150 35 190-55 200 55v65H0z" fill="${p[4]}"/>`;
    else forms=`<path d="M0 420Q330 400 455 285T800 280v220H0z" fill="${p[2]}"/><path d="M0 465q260-80 500-55t300-65v155H0z" fill="${p[3]}"/><path d="M0 480q250-10 400-5t400-40v65H0z" fill="${p[4]}"/>`;
    return `<div class="scene" aria-hidden="true"><svg viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="${id}" x2="0" y2="1"><stop stop-color="${p[0]}"/><stop offset="1" stop-color="${p[1]}"/></linearGradient></defs><rect width="800" height="500" fill="url(#${id})"/><circle cx="${kind==='night'?610:605}" cy="${kind==='alpine'?130:145}" r="${kind==='night'?36:64}" fill="${p[1]}" opacity="${kind==='night'?'.7':'.8'}"/>${kind==='night'?'<g fill="#c4c6da" opacity=".5"><circle cx="490" cy="80" r="1.5"/><circle cx="720" cy="45" r="1"/><circle cx="340" cy="110" r="1.3"/><circle cx="665" cy="205" r="1.5"/><circle cx="760" cy="140" r="1"/></g>':''}${forms}</svg></div>`;
  }
  const displayZone='Africa/Casablanca';
  const timeFormat=new Intl.DateTimeFormat('en',{hour:'2-digit',minute:'2-digit',hour12:false,timeZone:displayZone});
  const hourStart=Math.floor(Date.now()/3600000)*3600000;
  function programmeTime(){return `${timeFormat.format(hourStart)} – ${timeFormat.format(hourStart+3600000)}`;}
  function progress(){return Math.min(100,Math.max(2,((Date.now()-hourStart)/3600000)*100));}

v>`;

ss="switch" role="switch" aria-checked="${state.parental}" aria-label="Household PIN preview" data-action="parental" data-focus="parental"></button></div>${state.parental?`<div class="settings-buttons"><button class="btn" data-action="restrictions" data-focus="manage-restrictions">Manage channel locks</button></div>`:''}</section><section class="settings-card"><h2>${icon('clock')} Guide & storage</h2><div class="storage-stat"><strong>${state.recent.length}</strong><span>recently watched<br>sample channels</span></div><div class="settings-buttons"><button class="btn" data-action="refresh-guide" data-focus="refresh-guide">Refresh guide</button><button class="btn" data-action="clear-history" data-focus="clear-history">Clear history</button><button class="btn" data-action="clear-cache" data-focus="clear-cache">Clear cache</button></div><p style="margin-top:18px;margin-bottom:0">Only demo favorites, recent channel IDs, and playback preferences are saved in your browser.</p></section><section class="settings-card"><h2>${icon('live')} Made for your TV</h2><p>Your channels. Your space. RAPOPLAYER is an Android TV and Google TV player for your own authorized IPTV source. It provides no channels, subscriptions, or content.</p><div class="settings-buttons"><button class="btn" data-action="help" data-focus="about">About this prototype</button><button class="btn" data-action="welcome" data-focus="replay-welcome">Replay welcome</button></div><div class="version-row"><span>RAPOPLAYER</span><span>Interface prototype · v0.1</span></div></section><section class="settings-card"><h2>${icon('trash')} Start fresh</h2><p>Reset this prototype to its initial sample catalogue and preferences. This does not change the native Android application.</p><button class="btn danger" data-action="reset" data-focus="reset">Reset demo data</button></section></div>`;}
  function toggleFavorite(id){state.favorites.has(id)?state.favorites.delete(id):state.favorites.add(id);persist();if(state.player)renderPlayer();else render();toast(state.favorites.has(id)?'Added to your favorites.':'Removed from favorites.');}
  function showModal(kind,data={}){if(modal.open)closeModal(false);returnFocus=captureFocus();modalKind=kind;modalData=data;modal.className=kind==='welcome'?'welcome-dialog':'';modal.innerHTML=modalMarkup(kind,data);modal.showModal();const focus=modal.querySelector('[autofocus]')||modal.querySelector('button,input');focus?.focus();}

n type="button" class="btn ghost" data-action="close-modal">Cancel</button><button type="submit" class="btn primary">Preview connection ${icon('arrow')}</button></div></form>`;}

  function switchSourceType(type){const form=modal.querySelector('form');const data=Object.fromEntries(new FormData(form));modalData={...data,type};modal.innerHTML=modalMarkup('source',modalData);modal.querySelector(`[data-action="source-type"][data-value="${type}"]`)?.focus();}

  function leavePlayer(){clearTimeout(hideTimer);state.player=null;state.controls=true;player.hidden=true;player.innerHTML='';document.getElementById('app').inert=false;document.body.style.overflow='';render();setTimeout(()=>restoreFocus('channel-'+state.selected),30);}
  function switchChannel(delta){let list=filtered();if(!list.length)list=channels;const idx=list.findIndex(c=>c.id===state.player);watch(list[(idx+delta+list.length)%list.length].id);}
  function scheduleHide(){clearTimeout(hideTimer);if(state.player&&!state.paused&&!modal.open)hideTimer=setTimeout(()=>{state.controls=false;player.classList.add('controls-hidden');player.focus();},7000);}
  function revealControls(){state.controls=true;renderPlayer();setTimeout(()=>player.querySelector('[data-focus="player-pause"]')?.focus(),20);scheduleHide();}
  function confirm(title,message,intent,danger=false){showModal('confirm',{title,message,intent,danger});}
  function performConfirmed(intent){closeModal(false);if(intent==='history'){state.recent=[];persist();render();toast('Your demo watch history is clear.');}if(intent==='cache'){state.guideCleared=true;render();toast('Sample guide cleared. Your favorites are kept.');}if(intent==='reset'){try{localStorage.removeItem(storageKey);}catch(_){}state.favorites=new Set(['lumen','atlas']);state.recent=[];state.audio='English';state.subtitle='Off';state.fill=false;state.parental=false;state.locks.clear();state.guideCleared=false;state.sourceName='Studio playlist';navigate('Live');toast('A fresh start. Demo data has been reset.');}}
  function back(){if(modal.open){closeModal();return;}if(state.player){if(state.controls){state.controls=false;player.classList.add('controls-hidden');player.focus();}else leavePlayer();return;}if(state.view!=='Live'){navigate('Live');return;}if(state.category!=='All channels'){state.category='All channels';render();return;}showModal('welcome');}
  document.addEventListener('click',event=>{const button=event.target.closest('[data-action]');if(!button||button.disabled)return;const action=button.dataset.action,value=button.dataset.value;scheduleHide();switch(action){
    case'navigate':navigate(value);break;case'category':state.category=value;render();break;case'watch':watch(value);break;case'favorite':toggleFavorite(value);break;case'help':showModal('help');break;case'welcome':showModal('welcome');break;case'try-demo':closeModal(false);navigate('Live');toast('Make yourself at home. These channels are fictional.');break;case'source':showModal('source',{type:'M3U'});break;case'source-type':switchSourceType(value);break;case'close-modal':closeModal();break;case'password':{const input=modal.querySelector('[name="password"]');input.type=input.type==='password'?'text':'password';button.setAttribute('aria-label',input.type==='password'?'Show password':'Hide password');break;}case'refresh':toast('Refreshing the sample catalogue…');setTimeout(()=>{state.guideCleared=false;render();toast('Your demo channels are up to date.');},650);break;case'refresh-guide':state.guideCleared=false;render();toast('Sample guide refreshed.');break;case'clear-history':confirm('Clear your recent list?','This removes recently watched sample channel IDs from this browser.','history');break;case'clear-cache':confirm('A little more space.','Clear the sample programme guide. Your source label, favorites, and preferences are kept.','cache');break;case'reset':confirm('Start fresh?','Reset demo favorites, recent channels, preferences, and simulated restrictions.','reset',true);break;case'confirm':performConfirmed(modalData.intent);break;case'parental':if(state.parental)showModal('pin',{intent:'disable-parental'});else{state.parental=true;state.locks=new Set(['arc','pulse']);render();toast('PIN preview enabled. Demo PIN: 1234.');}break;case'restrictions':showModal('pin',{intent:'restrictions'});break;case'toggle-lock':state.locks.has(value)?state.locks.delete(value):state.locks.add(value);{const scroll=modal.scrollTop;modal.innerHTML=modalMarkup('restrictions',{});modal.scrollTop=scroll;modal.querySelector(`[data-value="${value}"]`)?.focus();}break;case'lock-channel':showModal('pin',{intent:'lock-channel',id:value});break;case'leave-player':leavePlayer();break;case'pause':state.paused=!state.paused;renderPlayer();scheduleHide();break;case'switch':switchChannel(Number(value));break;case'live-edge':state.paused=false;revealControls();toast('Back at the demo live edge.');break;case'audio':showModal('tracks',{type:'audio'});break;case'subtitle':showModal('tracks',{type:'subtitle'});break;case'track':state[button.dataset.type==='audio'?'audio':'subtitle']=value;persist();closeModal(false);if(state.player){renderPlayer();restoreFocus(button.dataset.type==='audio'?'player-audio':'player-subtitle');scheduleHide();}else render();break;case'fill':state.fill=!state.fill;persist();if(state.player){renderPlayer();toast(`Video scaling: ${state.fill?'Fill':'Fit'}.`);}else render();break;case'hide-controls':state.controls=false;player.classList.add('controls-hidden');player.focus();break;
  }});
  document.addEventListener('submit',event=>{event.preventDefault();if(event.target.id==='source-form'){beginImport(event.target);return;}if(event.target.id==='pin-form'){const value=document.getElementById('pin-input').value;if(value!=='1234'){document.getElementById('pin-error').hidden=false;document.getElementById('pin-input').value='';document.getElementById('pin-input').focus();return;}const data={...modalData};closeModal(false);if(data.intent==='watch')watch(data.id,true);if(data.intent==='disable-parental'){state.parental=false;state.locks.clear();render();toast('Demo household restrictions disabled.');}if(data.intent==='restrictions')showModal('restrictions');if(data.intent==='lock-channel'){state.locks.add(data.id);render();toast('Sample channel locked.');}}});
  document.addEventListener('input',event=>{if(event.target.id!=='search-input')return;state.query=event.target.value.slice(0,100);const result=filtered();if(!result.some(c=>c.id===state.selected)&&result.length)state.selected=result[0].id;document.getElementById('channel-list').innerHTML=listMarkup(result);document.getElementById('result-count').textContent=result.length+' CHANNEL'+(result.length===1?'':'S');document.getElementById('detail').innerHTML=result.length?detailMarkup(getChannel()):emptyMarkup();});
  document.addEventListener('change',event=>{const key=event.target.dataset.preference;if(key){state[key]=event.target.value;persist();toast('Playback preference saved for this demo.');}});
  document.addEventListener('focusin',event=>{const id=event.target.closest('[data-channel]')?.dataset.channel;if(id)selectChannel(id);if(state.player&&!modal.open)scheduleHide();});
  document.addEventListener('pointerover',event=>{if(modal.open||state.player)return;const id=event.target.closest('[data-channel]')?.dataset.channel;if(id)selectChannel(id);});
  modal.addEventListener('cancel',event=>{event.preventDefault();closeModal();});
  modal.addEventListener('click',event=>{if(event.target!==modal)return;const rect=modal.getBoundingClientRect();if(event.clientX<rect.left||event.clientX>rect.right||event.clientY<rect.top||event.clientY>rect.bottom)closeModal();});
  document.addEventListener('keydown',event=>{
    const editing=event.target.matches('input,textarea,select');
    if(event.key==='Escape'||event.key==='BrowserBack'){event.preventDefault();back();return;}
    if(editing&&(event.target.matches('select')||!['ArrowUp','ArrowDown'].includes(event.key)))return;
    if(event.key==='/'&&!modal.open){event.preventDefault();navigate('Search');return;}
    if(event.key==='?'&&!modal.open){event.preventDefault();showModal('help');return;}
    if(state.player&&!modal.open){if(event.key===' '){event.preventDefault();state.paused=!state.paused;state.controls=true;renderPlayer();scheduleHide();return;}if(!state.controls){if(event.key==='Enter'){event.preventDefault();revealControls();return;}if(event.key==='ArrowUp'||event.key==='ArrowDown'){event.preventDefault();switchChannel(event.key==='ArrowUp'?-1:1);return;}}}
    if(!['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(event.key))return;
    const scope=modal.open?modal:state.player?player:document.getElementById('app');
    const active=document.activeElement,origin=active.getBoundingClientRect();
    const candidates=[...scope.querySelectorAll('button:not(:disabled),input:not(:disabled),select:not(:disabled)')].filter(n=>{const r=n.getBoundingClientRect();return r.width&&r.height&&!n.closest('[hidden]')&&getComputedStyle(n).visibility!=='hidden';});
    const horizontal=event.key==='ArrowLeft'||event.key==='ArrowRight',sign=event.key==='ArrowLeft'||event.key==='ArrowUp'?-1:1;
    const ox=origin.x+origin.width/2,oy=origin.y+origin.height/2;
    const ranked=candidates.filter(n=>n!==active).map(n=>{const r=n.getBoundingClientRect(),dx=r.x+r.width/2-ox,dy=r.y+r.height/2-oy;const primary=horizontal?dx:dy,secondary=horizontal?dy:dx;return {node:n,primary,score:Math.abs(primary)+Math.abs(secondary)*2.6};}).filter(c=>c.primary*sign>5).sort((a,b)=>a.score-b.score);
    if(ranked.length){event.preventDefault();ranked[0].node.focus();ranked[0].node.scrollIntoView({block:'nearest',inline:'nearest'});}
  });
  function updateClock(){const now=new Date();document.getElementById('clock').textContent=timeFormat.format(now);document.getElementById('date').textContent=new Intl.DateTimeFormat('en',{weekday:'short',month:'short',day:'numeric',timeZone:displayZone}).format(now).toUpperCase();}
  document.addEventListener('visibilitychange',()=>{if(document.hidden&&state.player){state.paused=true;state.controls=true;renderPlayer();clearTimeout(hideTimer);}});
  render();updateClock();setInterval(updateClock,15000);
  if(new URLSearchParams(location.search).get('welcome')==='1')showModal('welcome');
  </script>
</body>
